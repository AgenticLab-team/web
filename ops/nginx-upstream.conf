# 流量现在指向哪一边。
#
# **这个文件是部署时唯一会被改写的 nginx 配置**，而且只改 server 那一行。
# 改完 `nginx -t` 再 `reload` —— reload 是平滑的：nginx 拉起新 worker 接新连接，
# 老 worker 把手上的请求处理完再退。所以切换本身不掉一个请求。
#
# 蓝 = 3000，绿 = 3001。哪个在跑看下面这行。
upstream agenticlab_app {
    server 127.0.0.1:3000;  # active=blue

    # 保持长连接，省掉每次代理都重新握手
    keepalive 32;
}
