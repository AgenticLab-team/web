# 把 502 / 503 / 504 换成一页给人看的东西。
#
# 这三个状态码在这个站上只有一个含义：**Node 进程这一刻不在**
# （部署重启、或者崩了正在被 systemd 拉起来）。
# nginx 默认那一页写的是「502 Bad Gateway」加一行 nginx 版本号 ——
# 对着它的人只会以为整个站没了。
#
# 装法见 scripts/install-error-page.sh；这个文件由 include 引进 server 块。

error_page 502 503 504 /__offline.html;

location = /__offline.html {
    root /var/www/agenticlab;
    internal;              # 只能由 error_page 内部跳转触发，不给直接访问
    add_header Cache-Control "no-store" always;
    # 这一页自己会重试，缓存住就永远显示「正在重启」了
}
