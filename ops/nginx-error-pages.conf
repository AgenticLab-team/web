# 把 502 / 503 / 504 换成一页给人看的东西。
#
# 这三个状态码在这个站上只有一个含义：**Node 进程这一刻不在**
# （部署重启、或者崩了正在被 systemd 拉起来）。
# nginx 默认那一页写的是「502 Bad Gateway」加一行 nginx 版本号 ——
# 对着它的人只会以为整个站没了。
#
# 装法见 scripts/install-error-page.sh；这个文件由 include 引进 server 块。
#
# ─────────────────────────────────────────
# `=503` 不是风格问题 —— 502 的时候用户根本看不到这一页
# ─────────────────────────────────────────
#
# 站点在 Cloudflare 后面，而 **Cloudflare 会把源站的 502 换成它自己的页**：
# 实测公网拿到的是 16 字节的 `error code: 502`（`content-type: text/plain`,
# `server: cloudflare`），而同一时刻在源站上直接打，
# 拿到的是这一页完整的 4660 字节。
#
# 也就是说这一页装好了、内容也对，而**没有一个用户见过它**。
#
# 503 是原样透传的（同样实测过：4660 字节、text/html、状态 503 到达浏览器）。
# 所以这里把 502/504 一并改写成 503 再出去。
#
# 顺带一提这个状态码本来就更准确：502 是「上游返回了不能理解的东西」，
# 而这个站上这三个码只有一个含义 —— **Node 进程这一刻不在**，
# 那是 503「暂时不可用」。
error_page 502 503 504 =503 /__offline.html;

location = /__offline.html {
    root /var/www/agenticlab;
    internal;              # 只能由 error_page 内部跳转触发，不给直接访问
    add_header Cache-Control "no-store" always;
    # 这一页自己会重试，缓存住就永远显示「正在重启」了

    # 告诉爬虫和监控这是暂时的，别把站点当成永久下线去处理
    add_header Retry-After "20" always;
}
